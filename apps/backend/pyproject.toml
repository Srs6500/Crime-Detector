[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "krogan-backend"
version = "0.1.0"
description = "Krogan safety companion API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "twilio>=9.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "boto3>=1.35.0",
    "aioapns>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
